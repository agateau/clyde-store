name: check-packages-main

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  check-packages:
    name: check-packages (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15
          - name: windows-x86_64
            os: windows-2022

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: |
          uv python install

      - name: Check Packages
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] ; then
            check_package_args="--all"
          else
            check_package_args=""
          fi
          export PYTHONUNBUFFERED=1
          export CLYDE_GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          uv run ci/check_packages.py main $check_package_args
